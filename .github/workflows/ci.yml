          -DANO_CRYPTO_HOSTED_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_HOSTED_ARTIFACT_ORIGIN=HOSTED_RUNNER
          -DANO_CRYPTO_HOSTED_EXECUTION_STATUS=COMPLETED
          -DANO_CRYPTO_HOSTED_WORKFLOW_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_HOSTED_WORKFLOW_REF=${{ github.ref }}
          -DANO_CRYPTO_HOSTED_REVIEW_STATUS=UNREVIEWED
          -DANO_CRYPTO_HOSTED_REVIEWER=UNPROVISIONED
          -DANO_CRYPTO_HOSTED_REVIEW_DATE=UNREVIEWED
          -DANO_CRYPTO_HOSTED_DISPOSITION=UNREVIEWED
          -P tools/create_hosted_artifact_manifest.cmake

      - name: Verify exported-symbol hosted artifact manifest
        run: >
          cmake
          -DANO_CRYPTO_SOURCE_DIR=${{ github.workspace }}
          -DANO_CRYPTO_HOSTED_ARTIFACT_ROOT=hosted-symbol-bundle
          -DANO_CRYPTO_EXPECTED_HOSTED_LANE=clean-release-symbol-compatibility
          -DANO_CRYPTO_EXPECTED_HOSTED_PLATFORM=${{ runner.os }}
          -DANO_CRYPTO_EXPECTED_HOSTED_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_EXPECTED_HOSTED_WORKFLOW_REF=${{ github.ref }}
          -P tools/check_hosted_artifact_manifest.cmake

      - name: Upload exported-symbol hosted bundle
        uses: actions/upload-artifact@v4
        with:
          name: anocrypto-c-p2-05-symbol-compatibility-${{ runner.os }}
          path: hosted-symbol-bundle
          if-no-files-found: error

      - name: Upload exported-symbol baseline report
        uses: actions/upload-artifact@v4
        with:
          name: exported-symbol-baseline-${{ runner.os }}
          path: build-clean-release/policy-check/EXPORTED_SYMBOL_BASELINE_CHECK.txt
