          -DANO_CRYPTO_HOSTED_ARTIFACT_ROOT=hosted-symbol-bundle
          "-DANO_CRYPTO_HOSTED_ARTIFACT_SOURCE_FILES=build-clean-release/policy-check/EXPORTED_SYMBOL_BASELINE_CHECK.txt;build-clean-release/policy-check/RELEASE_COMPATIBILITY_CHECK.txt"
