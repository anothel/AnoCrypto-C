name: AnoCrypto-C CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test-smoke:
    name: ${{ matrix.os }} / ${{ matrix.build_type }} / thread-safety-${{ matrix.thread_safety }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug]
        thread_safety: [ON]
        include:
          - os: ubuntu-latest
            build_type: Debug
            thread_safety: OFF

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DANO_CRYPTO_BUILD_TESTS=ON
          -DANO_CRYPTO_BUILD_EXAMPLES=ON
          -DANO_CRYPTO_ENABLE_STRICT_WARNINGS=ON
          -DANO_CRYPTO_ENABLE_ENTROPY_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_RANDOM_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_THREAD_SAFETY=${{ matrix.thread_safety }}
          -DANO_CRYPTO_ENABLE_OS_ENTROPY_PROVIDER=ON
          -DANO_CRYPTO_ENABLE_OPENSSL_DIFFERENTIAL_TESTS=OFF
          -DANO_CRYPTO_BUILD_GIT_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_BUILD_FINGERPRINT=AnoCrypto-C-p1-28-aes-cmac
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure

      - name: Capture hosted random platform review
        run: >
          ctest --test-dir build
          --build-config ${{ matrix.build_type }}
          -R "^ano_crypto_random_platform_review$"
          --verbose
          --output-log hosted-random-platform-review.txt

      - name: Upload hosted random platform review
        uses: actions/upload-artifact@v4
        with:
          name: hosted-random-platform-review-${{ runner.os }}-thread-safety-${{ matrix.thread_safety }}
          path: hosted-random-platform-review.txt
          if-no-files-found: error

      - name: Capture hosted thread platform review
        run: >
          ctest --test-dir build
          --build-config ${{ matrix.build_type }}
          -R "^ano_crypto_thread_platform_review$"
          --verbose
          --output-log hosted-thread-platform-review.txt

      - name: Upload hosted thread platform review
        uses: actions/upload-artifact@v4
        with:
          name: hosted-thread-platform-review-${{ runner.os }}-thread-safety-${{ matrix.thread_safety }}
          path: hosted-thread-platform-review.txt
          if-no-files-found: error

      - name: Capture hosted SHA-512 portability review
        run: >
          ctest --test-dir build
          --build-config ${{ matrix.build_type }}
          -R "^ano_crypto_sha512_portability_review$"
          --verbose
          --output-log hosted-sha512-portability-review.txt

      - name: Upload hosted SHA-512 portability review
        uses: actions/upload-artifact@v4
        with:
          name: hosted-sha512-portability-review-${{ runner.os }}-thread-safety-${{ matrix.thread_safety }}
          path: hosted-sha512-portability-review.txt
          if-no-files-found: error

      - name: Capture hosted AES/CBC hardening review
        run: >
          ctest --test-dir build
          --build-config ${{ matrix.build_type }}
          -R "^ano_crypto_aes_cbc_hardening_review$"
          --verbose
          --output-log hosted-aes-cbc-hardening-review.txt

      - name: Upload hosted AES/CBC hardening review
        uses: actions/upload-artifact@v4
        with:
          name: hosted-aes-cbc-hardening-review-${{ runner.os }}-thread-safety-${{ matrix.thread_safety }}
          path: hosted-aes-cbc-hardening-review.txt
          if-no-files-found: error

      - name: Public surface check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_public_surface_check

      - name: Thread-safety policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_thread_safety_policy_check

      - name: Concurrency and sanitizer policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_concurrency_sanitizer_policy_check

      - name: SHA-512-family implementation policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_sha512_family_policy_check

      - name: Differential and portability policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_differential_portability_policy_check

      - name: AES-CBC implementation policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_aes_cbc_policy_check

      - name: AES/CBC hardening policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_aes_hardening_policy_check

      - name: AES-CMAC implementation policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_cmac_policy_check

      - name: Random-service policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_random_service_policy_check

      - name: Random lifecycle hardening policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_random_lifecycle_policy_check

      - name: Entropy and health-test policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_entropy_health_policy_check

      - name: Entropy operational policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_entropy_operational_policy_check

      - name: Install
        run: cmake --install build --config ${{ matrix.build_type }} --prefix install-prefix

      - name: Configure install smoke
        run: cmake -S tests/install_smoke -B build-install-smoke -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install-prefix -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build install smoke
        run: cmake --build build-install-smoke --config ${{ matrix.build_type }} --parallel

      - name: Run install smoke on Unix-like runners
        if: runner.os != 'Windows'
        run: ./build-install-smoke/anocrypto_c_install_smoke

      - name: Run install smoke on Windows
        if: runner.os == 'Windows'
        run: .\build-install-smoke\${{ matrix.build_type }}\anocrypto_c_install_smoke.exe

      - name: PoC package smoke on Linux thread-safety ON
        if: runner.os == 'Linux' && matrix.thread_safety == 'ON'
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_poc_package_smoke

  differential-validation:
    name: Linux OpenSSL 3.x differential validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test-only reference provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Configure required differential lane
        run: >
          cmake -S . -B build-differential
          -DANO_CRYPTO_BUILD_TESTS=ON
          -DANO_CRYPTO_BUILD_EXAMPLES=OFF
          -DANO_CRYPTO_ENABLE_STRICT_WARNINGS=ON
          -DANO_CRYPTO_ENABLE_ENTROPY_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_RANDOM_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_THREAD_SAFETY=ON
          -DANO_CRYPTO_ENABLE_OS_ENTROPY_PROVIDER=OFF
          -DANO_CRYPTO_ENABLE_OPENSSL_DIFFERENTIAL_TESTS=ON
          -DANO_CRYPTO_REQUIRE_OPENSSL_DIFFERENTIAL_PROVIDER=ON
          -DANO_CRYPTO_BUILD_GIT_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_BUILD_FINGERPRINT=AnoCrypto-C-p1-28-aes-cmac-openssl
          -DCMAKE_BUILD_TYPE=Release

      - name: Build differential lane
        run: cmake --build build-differential --parallel

      - name: Run status-only differential validation
        run: >
          ctest --test-dir build-differential
          -L differential
          --verbose
          --output-log differential-validation.txt

      - name: Differential and portability policy check
        run: cmake --build build-differential --target ano_crypto_differential_portability_policy_check

      - name: AES-CBC implementation policy check
        run: cmake --build build-differential --target ano_crypto_aes_cbc_policy_check

      - name: AES/CBC hardening policy check
        run: cmake --build build-differential --target ano_crypto_aes_hardening_policy_check

      - name: Upload differential status artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha2-hmac-aes-cbc-openssl-differential-Linux
          path: differential-validation.txt
          if-no-files-found: error

  core-portability-32bit:
    name: Linux GCC 32-bit SHA-512 and AES portability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install multilib toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev-i386

      - name: Configure 32-bit build
        env:
          CC: gcc
        run: >
          cmake -S . -B build-32bit
          -DANO_CRYPTO_BUILD_TESTS=ON
          -DANO_CRYPTO_BUILD_EXAMPLES=OFF
          -DANO_CRYPTO_ENABLE_STRICT_WARNINGS=ON
          -DANO_CRYPTO_ENABLE_ENTROPY_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_RANDOM_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_THREAD_SAFETY=ON
          -DANO_CRYPTO_ENABLE_OS_ENTROPY_PROVIDER=OFF
          -DANO_CRYPTO_ENABLE_OPENSSL_DIFFERENTIAL_TESTS=OFF
          -DANO_CRYPTO_BUILD_GIT_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_BUILD_FINGERPRINT=AnoCrypto-C-p1-28-aes-cmac-linux32
          -DCMAKE_C_FLAGS=-m32
          -DCMAKE_EXE_LINKER_FLAGS=-m32
          -DCMAKE_SHARED_LINKER_FLAGS=-m32
          -DCMAKE_BUILD_TYPE=Release

      - name: Build 32-bit lane
        run: cmake --build build-32bit --parallel

      - name: Run 32-bit test suite
        run: ctest --test-dir build-32bit --output-on-failure

      - name: Capture 32-bit SHA-512 portability review
        run: >
          ctest --test-dir build-32bit
          -R "^ano_crypto_sha512_portability_review$"
          --verbose
          --output-log sha512-portability-32bit.txt

      - name: Capture 32-bit AES/CBC hardening review
        run: >
          ctest --test-dir build-32bit
          -R "^ano_crypto_aes_cbc_hardening_review$"
          --verbose
          --output-log aes-cbc-hardening-32bit.txt

      - name: Differential and portability policy check
        run: cmake --build build-32bit --target ano_crypto_differential_portability_policy_check

      - name: AES/CBC hardening policy check
        run: cmake --build build-32bit --target ano_crypto_aes_hardening_policy_check

      - name: Upload 32-bit portability artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sha512-aes-portability-Linux-32bit
          path: |
            sha512-portability-32bit.txt
            aes-cbc-hardening-32bit.txt
          if-no-files-found: error

  aes-compiler-output-review:
    name: Linux ${{ matrix.cc }} AES compiler-output capture
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Release capture build
        run: >
          cmake -S . -B build-aes-compiler-review
          -DANO_CRYPTO_BUILD_TESTS=OFF
          -DANO_CRYPTO_BUILD_EXAMPLES=OFF
          -DANO_CRYPTO_ENABLE_STRICT_WARNINGS=ON
          -DANO_CRYPTO_ENABLE_ENTROPY_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_RANDOM_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_OPENSSL_DIFFERENTIAL_TESTS=OFF
          -DANO_CRYPTO_HIDE_INTERNAL_SYMBOLS=OFF
          -DANO_CRYPTO_BUILD_GIT_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_BUILD_FINGERPRINT=AnoCrypto-C-p1-28-aes-cmac-${{ matrix.cc }}-compiler-review
          -DCMAKE_BUILD_TYPE=Release

      - name: Capture compiler output
        run: cmake --build build-aes-compiler-review --target ano_crypto_aes_compiler_review --parallel

      - name: AES/CBC hardening policy check
        run: cmake --build build-aes-compiler-review --target ano_crypto_aes_hardening_policy_check

      - name: Upload compiler-output artifact
        uses: actions/upload-artifact@v4
        with:
          name: aes-compiler-output-${{ matrix.cc }}-Linux
          path: build-aes-compiler-review/policy-check/aes-compiler-review
          if-no-files-found: error

  aes-big-endian-s390x:
    name: Linux s390x big-endian AES/SHA-512 cross-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install s390x cross toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-s390x-linux-gnu libc6-dev-s390x-cross qemu-user

      - name: Configure s390x build
        run: >
          cmake -S . -B build-s390x
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/linux-s390x-gcc.cmake
          -DANO_CRYPTO_BUILD_TESTS=ON
          -DANO_CRYPTO_BUILD_EXAMPLES=OFF
          -DANO_CRYPTO_ENABLE_STRICT_WARNINGS=ON
          -DANO_CRYPTO_ENABLE_ENTROPY_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_RANDOM_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_THREAD_SAFETY=ON
          -DANO_CRYPTO_ENABLE_OS_ENTROPY_PROVIDER=OFF
          -DANO_CRYPTO_ENABLE_OPENSSL_DIFFERENTIAL_TESTS=OFF
          -DBUILD_SHARED_LIBS=OFF
          -DANO_CRYPTO_BUILD_GIT_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_BUILD_FINGERPRINT=AnoCrypto-C-p1-28-aes-cmac-s390x
          -DCMAKE_BUILD_TYPE=Release

      - name: Build s390x lane
        run: cmake --build build-s390x --parallel

      - name: Run selected s390x AES/SHA-512 tests
        run: >
          ctest --test-dir build-s390x
          -R "ano_crypto_(aes_cbc|cipher_api|sha512)"
          --output-on-failure

      - name: Capture s390x AES/CBC hardening review
        run: >
          ctest --test-dir build-s390x
          -R "^ano_crypto_aes_cbc_hardening_review$"
          --verbose
          --output-log aes-cbc-hardening-s390x.txt

      - name: AES/CBC hardening policy check
        run: cmake --build build-s390x --target ano_crypto_aes_hardening_policy_check

      - name: Upload s390x status artifact
        uses: actions/upload-artifact@v4
        with:
          name: aes-sha512-portability-Linux-s390x
          path: aes-cbc-hardening-s390x.txt
          if-no-files-found: error

  sanitizer:
    name: Linux GCC ASan+UBSan
    runs-on: ubuntu-latest
    env:
      CC: gcc
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure sanitizer build
        run: >
          cmake -S . -B build-sanitizer
          -DANO_CRYPTO_BUILD_TESTS=ON
          -DANO_CRYPTO_BUILD_EXAMPLES=ON
          -DANO_CRYPTO_ENABLE_STRICT_WARNINGS=ON
          -DANO_CRYPTO_ENABLE_ENTROPY_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_RANDOM_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_THREAD_SAFETY=ON
          -DANO_CRYPTO_ENABLE_OS_ENTROPY_PROVIDER=ON
          -DANO_CRYPTO_ENABLE_OPENSSL_DIFFERENTIAL_TESTS=OFF
          -DANO_CRYPTO_SANITIZER_MODE=address-undefined
          -DANO_CRYPTO_BUILD_GIT_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_BUILD_FINGERPRINT=AnoCrypto-C-p1-28-aes-cmac-GCC-asan-ubsan
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build sanitizer lane
        run: cmake --build build-sanitizer --parallel

      - name: Run full sanitizer CTest
        run: ctest --test-dir build-sanitizer --output-on-failure

      - name: Concurrency and sanitizer policy check
        run: cmake --build build-sanitizer --target ano_crypto_concurrency_sanitizer_policy_check

      - name: AES/CBC hardening policy check
        run: cmake --build build-sanitizer --target ano_crypto_aes_hardening_policy_check

  random-lifecycle-hardening:
    name: Linux random lifecycle hardening
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure dedicated test-hook build
        run: >
          cmake -S . -B build-random-hardening
          -DANO_CRYPTO_BUILD_TESTS=ON
          -DANO_CRYPTO_BUILD_EXAMPLES=OFF
          -DANO_CRYPTO_ENABLE_STRICT_WARNINGS=ON
          -DANO_CRYPTO_ENABLE_ENTROPY_TEST_HOOKS=ON
          -DANO_CRYPTO_ENABLE_RANDOM_TEST_HOOKS=ON
          -DANO_CRYPTO_ENABLE_OS_ENTROPY_PROVIDER=OFF
          -DANO_CRYPTO_ENABLE_OPENSSL_DIFFERENTIAL_TESTS=OFF
          -DANO_CRYPTO_HIDE_INTERNAL_SYMBOLS=OFF
          -DANO_CRYPTO_ENABLE_THREAD_SAFETY=ON
          -DANO_CRYPTO_BUILD_GIT_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_BUILD_FINGERPRINT=AnoCrypto-C-p1-28-aes-cmac-test-hook
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build dedicated test-hook lane
        run: cmake --build build-random-hardening --parallel

      - name: Run entropy and random hardening tests
        run: ctest --test-dir build-random-hardening -L entropy-failure-injection --output-on-failure

      - name: Entropy and health-test policy check
        run: cmake --build build-random-hardening --target ano_crypto_entropy_health_policy_check

      - name: Entropy operational policy check
        run: cmake --build build-random-hardening --target ano_crypto_entropy_operational_policy_check

      - name: Random-service policy check
        run: cmake --build build-random-hardening --target ano_crypto_random_service_policy_check

      - name: Random lifecycle hardening policy check
        run: cmake --build build-random-hardening --target ano_crypto_random_lifecycle_policy_check

  random-provider-disabled:
    name: Linux random provider disabled
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure provider-disabled build
        run: >
          cmake -S . -B build-provider-disabled
          -DANO_CRYPTO_BUILD_TESTS=ON
          -DANO_CRYPTO_BUILD_EXAMPLES=OFF
          -DANO_CRYPTO_ENABLE_STRICT_WARNINGS=ON
          -DANO_CRYPTO_ENABLE_ENTROPY_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_RANDOM_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_OS_ENTROPY_PROVIDER=OFF
          -DANO_CRYPTO_ENABLE_OPENSSL_DIFFERENTIAL_TESTS=OFF
          -DANO_CRYPTO_ENABLE_THREAD_SAFETY=ON
          -DANO_CRYPTO_BUILD_GIT_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_BUILD_FINGERPRINT=AnoCrypto-C-p1-28-aes-cmac-provider-disabled
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build provider-disabled lane
        run: cmake --build build-provider-disabled --parallel

      - name: Run provider-disabled tests
        run: ctest --test-dir build-provider-disabled --output-on-failure

      - name: Random-service policy check
        run: cmake --build build-provider-disabled --target ano_crypto_random_service_policy_check

      - name: Random lifecycle hardening policy check
        run: cmake --build build-provider-disabled --target ano_crypto_random_lifecycle_policy_check

      - name: Entropy operational policy check
        run: cmake --build build-provider-disabled --target ano_crypto_entropy_operational_policy_check

      - name: AES/CBC hardening policy check
        run: cmake --build build-provider-disabled --target ano_crypto_aes_hardening_policy_check

  clean-release-symbol-baseline:
    name: ${{ matrix.os }} clean Release exported-symbol baseline
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure clean Release
        run: >
          cmake -S . -B build-clean-release
          -DANO_CRYPTO_BUILD_TESTS=OFF
          -DANO_CRYPTO_BUILD_EXAMPLES=OFF
          -DANO_CRYPTO_ENABLE_STRICT_WARNINGS=ON
          -DANO_CRYPTO_ENABLE_ENTROPY_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_RANDOM_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_OPENSSL_DIFFERENTIAL_TESTS=OFF
          -DANO_CRYPTO_HIDE_INTERNAL_SYMBOLS=ON
          -DBUILD_SHARED_LIBS=ON
          -DANO_CRYPTO_BUILD_GIT_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_BUILD_FINGERPRINT=AnoCrypto-C-p1-28-aes-cmac-clean-release
          -DCMAKE_BUILD_TYPE=Release

      - name: Compare clean Release exports with ABI-0 baseline
        run: cmake --build build-clean-release --config Release --target ano_crypto_exported_symbol_baseline_check

      - name: Upload exported-symbol baseline report
        uses: actions/upload-artifact@v4
        with:
          name: exported-symbol-baseline-${{ runner.os }}
          path: build-clean-release/policy-check/EXPORTED_SYMBOL_BASELINE_CHECK.txt
          if-no-files-found: error

  evidence-draft:
    name: Linux evidence draft
    runs-on: ubuntu-latest
    needs: [build-test-smoke, differential-validation, core-portability-32bit, aes-compiler-output-review, aes-big-endian-s390x, sanitizer, clean-release-symbol-baseline]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test-only reference provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DANO_CRYPTO_BUILD_TESTS=ON
          -DANO_CRYPTO_BUILD_EXAMPLES=ON
          -DANO_CRYPTO_ENABLE_STRICT_WARNINGS=ON
          -DANO_CRYPTO_ENABLE_ENTROPY_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_RANDOM_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_THREAD_SAFETY=ON
          -DANO_CRYPTO_ENABLE_OS_ENTROPY_PROVIDER=ON
          -DANO_CRYPTO_ENABLE_OPENSSL_DIFFERENTIAL_TESTS=ON
          -DANO_CRYPTO_REQUIRE_OPENSSL_DIFFERENTIAL_PROVIDER=ON
          -DANO_CRYPTO_BUILD_GIT_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_BUILD_FINGERPRINT=AnoCrypto-C-p1-28-aes-cmac
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Collect evidence draft
        run: cmake --build build --target ano_crypto_collect_release_evidence

      - name: Upload evidence draft
        uses: actions/upload-artifact@v4
        with:
          name: anocrypto-c-p1-28-evidence-draft
          path: build/evidence/p1-28
          if-no-files-found: error
