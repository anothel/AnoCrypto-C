name: AnoCrypto-C CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test-smoke:
    name: ${{ matrix.os }} / ${{ matrix.build_type }} / thread-safety-${{ matrix.thread_safety }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug]
        thread_safety: [ON]
        include:
          - os: ubuntu-latest
            build_type: Debug
            thread_safety: OFF

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DANO_CRYPTO_BUILD_TESTS=ON
          -DANO_CRYPTO_BUILD_EXAMPLES=ON
          -DANO_CRYPTO_ENABLE_STRICT_WARNINGS=ON
          -DANO_CRYPTO_ENABLE_ENTROPY_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_RANDOM_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_THREAD_SAFETY=${{ matrix.thread_safety }}
          -DANO_CRYPTO_ENABLE_OS_ENTROPY_PROVIDER=ON
          -DANO_CRYPTO_ENABLE_OPENSSL_DIFFERENTIAL_TESTS=OFF
          -DANO_CRYPTO_BUILD_GIT_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_BUILD_FINGERPRINT=AnoCrypto-C-p2-07-submission-documents
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure

      - name: Capture hosted random platform review
        run: >
          ctest --test-dir build
          --build-config ${{ matrix.build_type }}
          -R "^ano_crypto_random_platform_review$"
          --verbose
          --output-log hosted-random-platform-review.txt

      - name: Upload hosted random platform review
        uses: actions/upload-artifact@v4
        with:
          name: hosted-random-platform-review-${{ runner.os }}-thread-safety-${{ matrix.thread_safety }}
          path: hosted-random-platform-review.txt
          if-no-files-found: error

      - name: Capture hosted thread platform review
        run: >
          ctest --test-dir build
          --build-config ${{ matrix.build_type }}
          -R "^ano_crypto_thread_platform_review$"
          --verbose
          --output-log hosted-thread-platform-review.txt

      - name: Upload hosted thread platform review
        uses: actions/upload-artifact@v4
        with:
          name: hosted-thread-platform-review-${{ runner.os }}-thread-safety-${{ matrix.thread_safety }}
          path: hosted-thread-platform-review.txt
          if-no-files-found: error

      - name: Capture hosted SHA-512 portability review
        run: >
          ctest --test-dir build
          --build-config ${{ matrix.build_type }}
          -R "^ano_crypto_sha512_portability_review$"
          --verbose
          --output-log hosted-sha512-portability-review.txt

      - name: Upload hosted SHA-512 portability review
        uses: actions/upload-artifact@v4
        with:
          name: hosted-sha512-portability-review-${{ runner.os }}-thread-safety-${{ matrix.thread_safety }}
          path: hosted-sha512-portability-review.txt
          if-no-files-found: error

      - name: Capture hosted AES/CBC hardening review
        run: >
          ctest --test-dir build
          --build-config ${{ matrix.build_type }}
          -R "^ano_crypto_aes_cbc_hardening_review$"
          --verbose
          --output-log hosted-aes-cbc-hardening-review.txt

      - name: Upload hosted AES/CBC hardening review
        uses: actions/upload-artifact@v4
        with:
          name: hosted-aes-cbc-hardening-review-${{ runner.os }}-thread-safety-${{ matrix.thread_safety }}
          path: hosted-aes-cbc-hardening-review.txt
          if-no-files-found: error

      - name: Capture hosted AES-CMAC hardening review
        run: >
          ctest --test-dir build
          --build-config ${{ matrix.build_type }}
          -R "^ano_crypto_aes_cmac_hardening_review$"
          --verbose
          --output-log hosted-aes-cmac-hardening-review.txt

      - name: Upload hosted AES-CMAC hardening review
        uses: actions/upload-artifact@v4
        with:
          name: hosted-aes-cmac-hardening-review-${{ runner.os }}-thread-safety-${{ matrix.thread_safety }}
          path: hosted-aes-cmac-hardening-review.txt
          if-no-files-found: error

      - name: Create hosted platform artifact manifest
        run: >
          cmake
          -DANO_CRYPTO_SOURCE_DIR=${{ github.workspace }}
          -DANO_CRYPTO_HOSTED_ARTIFACT_ROOT=hosted-artifact-bundle
          "-DANO_CRYPTO_HOSTED_ARTIFACT_SOURCE_FILES=hosted-random-platform-review.txt;hosted-thread-platform-review.txt;hosted-sha512-portability-review.txt;hosted-aes-cbc-hardening-review.txt;hosted-aes-cmac-hardening-review.txt"
          -DANO_CRYPTO_HOSTED_LANE=platform-thread-safety-${{ matrix.thread_safety }}
          -DANO_CRYPTO_HOSTED_PLATFORM=${{ runner.os }}
          -DANO_CRYPTO_HOSTED_ARCH=runner-default
          -DANO_CRYPTO_HOSTED_COMPILER=cmake-configured
          -DANO_CRYPTO_HOSTED_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_HOSTED_ARTIFACT_ORIGIN=HOSTED_RUNNER
          -DANO_CRYPTO_HOSTED_EXECUTION_STATUS=COMPLETED
          -DANO_CRYPTO_HOSTED_WORKFLOW_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_HOSTED_WORKFLOW_REF=${{ github.ref }}
          -DANO_CRYPTO_HOSTED_REVIEW_STATUS=UNREVIEWED
          -DANO_CRYPTO_HOSTED_REVIEWER=UNPROVISIONED
          -DANO_CRYPTO_HOSTED_REVIEW_DATE=UNREVIEWED
          -DANO_CRYPTO_HOSTED_DISPOSITION=UNREVIEWED
          -P tools/create_hosted_artifact_manifest.cmake

      - name: Verify hosted platform artifact manifest
        run: >
          cmake
          -DANO_CRYPTO_SOURCE_DIR=${{ github.workspace }}
          -DANO_CRYPTO_HOSTED_ARTIFACT_ROOT=hosted-artifact-bundle
          -DANO_CRYPTO_EXPECTED_HOSTED_LANE=platform-thread-safety-${{ matrix.thread_safety }}
          -DANO_CRYPTO_EXPECTED_HOSTED_PLATFORM=${{ runner.os }}
          -DANO_CRYPTO_EXPECTED_HOSTED_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_EXPECTED_HOSTED_WORKFLOW_REF=${{ github.ref }}
          -P tools/check_hosted_artifact_manifest.cmake

      - name: Upload hosted platform review bundle
        uses: actions/upload-artifact@v4
        with:
          name: anocrypto-c-p2-05-hosted-platform-${{ runner.os }}-thread-safety-${{ matrix.thread_safety }}
          path: hosted-artifact-bundle
          if-no-files-found: error

      - name: Release compatibility policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_release_compatibility_policy_check

      - name: Release provenance and source SBOM policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_release_provenance_policy_check

      - name: Public surface check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_public_surface_check

      - name: P2-02 validation candidate boundary policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_validation_candidate_policy_check

      - name: P2-03 self-test and integrity policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_self_test_integrity_policy_check

      - name: Thread-safety policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_thread_safety_policy_check

      - name: Concurrency and sanitizer policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_concurrency_sanitizer_policy_check

      - name: SHA-512-family implementation policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_sha512_family_policy_check

      - name: Differential and portability policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_differential_portability_policy_check

      - name: AES-CBC implementation policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_aes_cbc_policy_check

      - name: AES/CBC hardening policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_aes_hardening_policy_check

      - name: AES-CMAC implementation policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_cmac_policy_check

      - name: AES-CMAC hardening policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_cmac_hardening_policy_check

      - name: Random-service policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_random_service_policy_check

      - name: Random lifecycle hardening policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_random_lifecycle_policy_check

      - name: Entropy and health-test policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_entropy_health_policy_check

      - name: Entropy operational policy check
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_entropy_operational_policy_check

      - name: Install
        run: cmake --install build --config ${{ matrix.build_type }} --prefix install-prefix

      - name: Configure install smoke
        run: cmake -S tests/install_smoke -B build-install-smoke -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install-prefix -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build install smoke
        run: cmake --build build-install-smoke --config ${{ matrix.build_type }} --parallel

      - name: Run install smoke on Unix-like runners
        if: runner.os != 'Windows'
        run: ./build-install-smoke/anocrypto_c_install_smoke

      - name: Run install smoke on Windows
        if: runner.os == 'Windows'
        run: .\build-install-smoke\${{ matrix.build_type }}\anocrypto_c_install_smoke.exe

      - name: PoC package smoke on Linux thread-safety ON
        if: runner.os == 'Linux' && matrix.thread_safety == 'ON'
        run: cmake --build build --config ${{ matrix.build_type }} --target ano_crypto_poc_package_smoke

  differential-validation:
    name: Linux OpenSSL 3.x differential validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test-only reference provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Configure required differential lane
        run: >
          cmake -S . -B build-differential
          -DANO_CRYPTO_BUILD_TESTS=ON
          -DANO_CRYPTO_BUILD_EXAMPLES=OFF
          -DANO_CRYPTO_ENABLE_STRICT_WARNINGS=ON
          -DANO_CRYPTO_ENABLE_ENTROPY_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_RANDOM_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_THREAD_SAFETY=ON
          -DANO_CRYPTO_ENABLE_OS_ENTROPY_PROVIDER=OFF
          -DANO_CRYPTO_ENABLE_OPENSSL_DIFFERENTIAL_TESTS=ON
          -DANO_CRYPTO_REQUIRE_OPENSSL_DIFFERENTIAL_PROVIDER=ON
          -DANO_CRYPTO_BUILD_GIT_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_BUILD_FINGERPRINT=AnoCrypto-C-p2-07-submission-documents-openssl
          -DCMAKE_BUILD_TYPE=Release

      - name: Build differential lane
        run: cmake --build build-differential --parallel

      - name: Run status-only differential validation
        run: >
          ctest --test-dir build-differential
          -L differential
          --verbose
          --output-log differential-validation.txt

      - name: Differential and portability policy check
        run: cmake --build build-differential --target ano_crypto_differential_portability_policy_check

      - name: AES-CBC implementation policy check
        run: cmake --build build-differential --target ano_crypto_aes_cbc_policy_check

      - name: AES/CBC hardening policy check
        run: cmake --build build-differential --target ano_crypto_aes_hardening_policy_check

      - name: AES-CMAC hardening policy check
        run: cmake --build build-differential --target ano_crypto_cmac_hardening_policy_check

      - name: Create differential hosted artifact manifest
        run: >
          cmake
          -DANO_CRYPTO_SOURCE_DIR=${{ github.workspace }}
          -DANO_CRYPTO_HOSTED_ARTIFACT_ROOT=hosted-differential-bundle
          -DANO_CRYPTO_HOSTED_ARTIFACT_SOURCE_FILES=differential-validation.txt
          -DANO_CRYPTO_HOSTED_LANE=openssl-differential
          -DANO_CRYPTO_HOSTED_PLATFORM=Linux
          -DANO_CRYPTO_HOSTED_ARCH=x86_64
          -DANO_CRYPTO_HOSTED_COMPILER=system-default
          -DANO_CRYPTO_HOSTED_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_HOSTED_ARTIFACT_ORIGIN=HOSTED_RUNNER
          -DANO_CRYPTO_HOSTED_EXECUTION_STATUS=COMPLETED
          -DANO_CRYPTO_HOSTED_WORKFLOW_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_HOSTED_WORKFLOW_REF=${{ github.ref }}
          -DANO_CRYPTO_HOSTED_REVIEW_STATUS=UNREVIEWED
          -DANO_CRYPTO_HOSTED_REVIEWER=UNPROVISIONED
          -DANO_CRYPTO_HOSTED_REVIEW_DATE=UNREVIEWED
          -DANO_CRYPTO_HOSTED_DISPOSITION=UNREVIEWED
          -P tools/create_hosted_artifact_manifest.cmake

      - name: Verify differential hosted artifact manifest
        run: >
          cmake
          -DANO_CRYPTO_SOURCE_DIR=${{ github.workspace }}
          -DANO_CRYPTO_HOSTED_ARTIFACT_ROOT=hosted-differential-bundle
          -DANO_CRYPTO_EXPECTED_HOSTED_LANE=openssl-differential
          -DANO_CRYPTO_EXPECTED_HOSTED_PLATFORM=Linux
          -DANO_CRYPTO_EXPECTED_HOSTED_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_EXPECTED_HOSTED_WORKFLOW_REF=${{ github.ref }}
          -P tools/check_hosted_artifact_manifest.cmake

      - name: Upload differential hosted bundle
        uses: actions/upload-artifact@v4
        with:
          name: anocrypto-c-p2-05-openssl-differential-Linux
          path: hosted-differential-bundle
          if-no-files-found: error

      - name: Upload differential status artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha2-hmac-aes-cbc-cmac-openssl-differential-Linux
          path: differential-validation.txt
          if-no-files-found: error

  core-portability-32bit:
    name: Linux GCC 32-bit SHA-512 and AES portability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install multilib toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev-i386

      - name: Configure 32-bit build
        env:
          CC: gcc
        run: >
          cmake -S . -B build-32bit
          -DANO_CRYPTO_BUILD_TESTS=ON
          -DANO_CRYPTO_BUILD_EXAMPLES=OFF
          -DANO_CRYPTO_ENABLE_STRICT_WARNINGS=ON
          -DANO_CRYPTO_ENABLE_ENTROPY_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_RANDOM_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_THREAD_SAFETY=ON
          -DANO_CRYPTO_ENABLE_OS_ENTROPY_PROVIDER=OFF
          -DANO_CRYPTO_ENABLE_OPENSSL_DIFFERENTIAL_TESTS=OFF
          -DANO_CRYPTO_BUILD_GIT_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_BUILD_FINGERPRINT=AnoCrypto-C-p2-07-submission-documents-linux32
          -DCMAKE_C_FLAGS=-m32
          -DCMAKE_EXE_LINKER_FLAGS=-m32
          -DCMAKE_SHARED_LINKER_FLAGS=-m32
          -DCMAKE_BUILD_TYPE=Release

      - name: Build 32-bit lane
        run: cmake --build build-32bit --parallel

      - name: Run 32-bit test suite
        run: ctest --test-dir build-32bit --output-on-failure

      - name: Capture 32-bit SHA-512 portability review
        run: >
          ctest --test-dir build-32bit
          -R "^ano_crypto_sha512_portability_review$"
          --verbose
          --output-log sha512-portability-32bit.txt

      - name: Capture 32-bit AES/CBC hardening review
        run: >
          ctest --test-dir build-32bit
          -R "^ano_crypto_aes_cbc_hardening_review$"
          --verbose
          --output-log aes-cbc-hardening-32bit.txt

      - name: Capture 32-bit AES-CMAC hardening review
        run: >
          ctest --test-dir build-32bit
          -R "^ano_crypto_aes_cmac_hardening_review$"
          --verbose
          --output-log aes-cmac-hardening-32bit.txt

      - name: Differential and portability policy check
        run: cmake --build build-32bit --target ano_crypto_differential_portability_policy_check

      - name: AES/CBC hardening policy check
        run: cmake --build build-32bit --target ano_crypto_aes_hardening_policy_check

      - name: AES-CMAC hardening policy check
        run: cmake --build build-32bit --target ano_crypto_cmac_hardening_policy_check

      - name: Create 32-bit hosted artifact manifest
        run: >
          cmake
          -DANO_CRYPTO_SOURCE_DIR=${{ github.workspace }}
          -DANO_CRYPTO_HOSTED_ARTIFACT_ROOT=hosted-32bit-bundle
          "-DANO_CRYPTO_HOSTED_ARTIFACT_SOURCE_FILES=sha512-portability-32bit.txt;aes-cbc-hardening-32bit.txt;aes-cmac-hardening-32bit.txt"
          -DANO_CRYPTO_HOSTED_LANE=linux-32bit-portability
          -DANO_CRYPTO_HOSTED_PLATFORM=Linux
          -DANO_CRYPTO_HOSTED_ARCH=x86
          -DANO_CRYPTO_HOSTED_COMPILER=gcc-m32
          -DANO_CRYPTO_HOSTED_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_HOSTED_ARTIFACT_ORIGIN=HOSTED_RUNNER
          -DANO_CRYPTO_HOSTED_EXECUTION_STATUS=COMPLETED
          -DANO_CRYPTO_HOSTED_WORKFLOW_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_HOSTED_WORKFLOW_REF=${{ github.ref }}
          -DANO_CRYPTO_HOSTED_REVIEW_STATUS=UNREVIEWED
          -DANO_CRYPTO_HOSTED_REVIEWER=UNPROVISIONED
          -DANO_CRYPTO_HOSTED_REVIEW_DATE=UNREVIEWED
          -DANO_CRYPTO_HOSTED_DISPOSITION=UNREVIEWED
          -P tools/create_hosted_artifact_manifest.cmake

      - name: Verify 32-bit hosted artifact manifest
        run: >
          cmake
          -DANO_CRYPTO_SOURCE_DIR=${{ github.workspace }}
          -DANO_CRYPTO_HOSTED_ARTIFACT_ROOT=hosted-32bit-bundle
          -DANO_CRYPTO_EXPECTED_HOSTED_LANE=linux-32bit-portability
          -DANO_CRYPTO_EXPECTED_HOSTED_PLATFORM=Linux
          -DANO_CRYPTO_EXPECTED_HOSTED_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_EXPECTED_HOSTED_WORKFLOW_REF=${{ github.ref }}
          -P tools/check_hosted_artifact_manifest.cmake

      - name: Upload 32-bit hosted bundle
        uses: actions/upload-artifact@v4
        with:
          name: anocrypto-c-p2-05-portability-Linux-32bit
          path: hosted-32bit-bundle
          if-no-files-found: error

      - name: Upload 32-bit portability artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sha512-aes-portability-Linux-32bit
          path: |
            sha512-portability-32bit.txt
            aes-cbc-hardening-32bit.txt
            aes-cmac-hardening-32bit.txt
          if-no-files-found: error

  aes-cmac-compiler-output-review:
    name: Linux ${{ matrix.cc }} AES/CMAC compiler-output capture
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Release capture build
        run: >
          cmake -S . -B build-compiler-review
          -DANO_CRYPTO_BUILD_TESTS=OFF
          -DANO_CRYPTO_BUILD_EXAMPLES=OFF
          -DANO_CRYPTO_ENABLE_STRICT_WARNINGS=ON
          -DANO_CRYPTO_ENABLE_ENTROPY_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_RANDOM_TEST_HOOKS=OFF
          -DANO_CRYPTO_ENABLE_OPENSSL_DIFFERENTIAL_TESTS=OFF
          -DANO_CRYPTO_HIDE_INTERNAL_SYMBOLS=OFF
          -DANO_CRYPTO_BUILD_GIT_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_BUILD_FINGERPRINT=AnoCrypto-C-p2-07-submission-documents-${{ matrix.cc }}-compiler-review
          -DCMAKE_BUILD_TYPE=Release

      - name: Capture AES compiler output
        run: cmake --build build-compiler-review --target ano_crypto_aes_compiler_review --parallel

      - name: Capture CMAC compiler output
        run: cmake --build build-compiler-review --target ano_crypto_cmac_compiler_review --parallel

      - name: AES/CBC hardening policy check
        run: cmake --build build-compiler-review --target ano_crypto_aes_hardening_policy_check

      - name: AES-CMAC hardening policy check
        run: cmake --build build-compiler-review --target ano_crypto_cmac_hardening_policy_check

      - name: Create compiler-output hosted artifact manifest
        run: >
          cmake
          -DANO_CRYPTO_SOURCE_DIR=${{ github.workspace }}
          -DANO_CRYPTO_HOSTED_ARTIFACT_ROOT=hosted-compiler-bundle
          "-DANO_CRYPTO_HOSTED_ARTIFACT_SOURCE_FILES=build-compiler-review/policy-check/aes-compiler-review/AES_COMPILER_OUTPUT_REVIEW.txt;build-compiler-review/policy-check/aes-compiler-review/AES_COMPILER_OUTPUT_DISASSEMBLY.txt;build-compiler-review/policy-check/cmac-compiler-review/CMAC_COMPILER_OUTPUT_REVIEW.txt;build-compiler-review/policy-check/cmac-compiler-review/CMAC_COMPILER_OUTPUT_DISASSEMBLY.txt"
          -DANO_CRYPTO_HOSTED_LANE=aes-cmac-compiler-output-${{ matrix.cc }}
          -DANO_CRYPTO_HOSTED_PLATFORM=Linux
          -DANO_CRYPTO_HOSTED_ARCH=x86_64
          -DANO_CRYPTO_HOSTED_COMPILER=${{ matrix.cc }}
          -DANO_CRYPTO_HOSTED_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_HOSTED_ARTIFACT_ORIGIN=HOSTED_RUNNER
          -DANO_CRYPTO_HOSTED_EXECUTION_STATUS=COMPLETED
          -DANO_CRYPTO_HOSTED_WORKFLOW_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_HOSTED_WORKFLOW_REF=${{ github.ref }}
          -DANO_CRYPTO_HOSTED_REVIEW_STATUS=UNREVIEWED
          -DANO_CRYPTO_HOSTED_REVIEWER=UNPROVISIONED
          -DANO_CRYPTO_HOSTED_REVIEW_DATE=UNREVIEWED
          -DANO_CRYPTO_HOSTED_DISPOSITION=UNREVIEWED
          -P tools/create_hosted_artifact_manifest.cmake

      - name: Verify compiler-output hosted artifact manifest
        run: >
          cmake
          -DANO_CRYPTO_SOURCE_DIR=${{ github.workspace }}
          -DANO_CRYPTO_HOSTED_ARTIFACT_ROOT=hosted-compiler-bundle
          -DANO_CRYPTO_EXPECTED_HOSTED_LANE=aes-cmac-compiler-output-${{ matrix.cc }}
          -DANO_CRYPTO_EXPECTED_HOSTED_PLATFORM=Linux
          -DANO_CRYPTO_EXPECTED_HOSTED_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_EXPECTED_HOSTED_WORKFLOW_REF=${{ github.ref }}
          -P tools/check_hosted_artifact_manifest.cmake

      - name: Upload compiler-output hosted bundle
        uses: actions/upload-artifact@v4
        with:
          name: anocrypto-c-p2-05-compiler-output-${{ matrix.cc }}-Linux
          path: hosted-compiler-bundle
          if-no-files-found: error

      - name: Upload compiler-output artifact
        uses: actions/upload-artifact@v4
        with:
          name: aes-cmac-compiler-output-${{ matrix.cc }}-Linux
          path: |
            build-compiler-review/policy-check/aes-compiler-review
            build-compiler-review/policy-check/cmac-compiler-review
          if-no-files-found: error

  aes-big-endian-s390x:
    name: Linux s390x big-endian AES/SHA-512 cross-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install s390x cross toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-s390x-linux-gnu libc6-dev-s390x-cross qemu-user

      - name: Configure s390x build
        run: >
          cmake -S . -B build-s390x
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/linux-s390x-gcc.cmake
          -DANO_CRYPTO_BUILD_TESTS=ON
          -DANO_CRYPTO_BUILD_EXAMPLES=OFF
          -DANO_CRYPTO_ENABLE_STRICT_WARNINGS=ON
