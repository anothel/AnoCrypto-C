          -DANO_CRYPTO_EXPECTED_HOSTED_WORKFLOW_REF=${{ github.ref }}
          -P tools/check_hosted_artifact_manifest.cmake

      - name: Upload release provenance hosted bundle
        uses: actions/upload-artifact@v4
        with:
          name: anocrypto-c-p2-05-release-provenance-Linux-${{ matrix.cc }}
          path: hosted-release-provenance-bundle
          if-no-files-found: error

      - name: Create release signing-handoff hosted artifact manifest
        run: >
          cmake
          -DANO_CRYPTO_SOURCE_DIR=${{ github.workspace }}
          -DANO_CRYPTO_HOSTED_ARTIFACT_ROOT=hosted-release-signing-handoff-bundle
          "-DANO_CRYPTO_HOSTED_ARTIFACT_SOURCE_FILES=build/evidence/p2-07/RELEASE_SIGNING_HANDOFF_CHECK.txt;build/evidence/p2-07/release-signing-handoff/APPROVED_RELEASE_SIGNERS.txt;build/evidence/p2-07/release-signing-handoff/APPROVED_TIMESTAMP_POLICY.txt;build/evidence/p2-07/release-signing-handoff/HOSTED_ARTIFACT_DISPOSITION.txt;build/evidence/p2-07/release-signing-handoff/RELEASE_ARTIFACTS.sha256;build/evidence/p2-07/release-signing-handoff/RELEASE_AUTHORIZATION.md;build/evidence/p2-07/release-signing-handoff/RELEASE_PROVENANCE.txt;build/evidence/p2-07/release-signing-handoff/SIGNING_HANDOFF_FILES.sha256;build/evidence/p2-07/release-signing-handoff/SIGNING_HANDOFF_STATUS.txt;build/evidence/p2-07/release-signing-handoff/SIGNING_POLICY.txt;build/evidence/p2-07/release-signing-handoff/SIGNING_REQUEST.txt"
          -DANO_CRYPTO_HOSTED_LANE=${{ env.HOSTED_SIGNING_LANE }}
          -DANO_CRYPTO_HOSTED_PLATFORM=Linux
          -DANO_CRYPTO_HOSTED_ARCH=x86_64
          -DANO_CRYPTO_HOSTED_COMPILER=${{ matrix.cc }}
          -DANO_CRYPTO_HOSTED_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_HOSTED_ARTIFACT_ORIGIN=HOSTED_RUNNER
          -DANO_CRYPTO_HOSTED_EXECUTION_STATUS=COMPLETED
          -DANO_CRYPTO_HOSTED_WORKFLOW_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_HOSTED_WORKFLOW_REF=${{ github.ref }}
          -DANO_CRYPTO_HOSTED_REVIEW_STATUS=UNREVIEWED
          -DANO_CRYPTO_HOSTED_REVIEWER=UNPROVISIONED
          -DANO_CRYPTO_HOSTED_REVIEW_DATE=UNREVIEWED
          -DANO_CRYPTO_HOSTED_DISPOSITION=UNREVIEWED
          -P tools/create_hosted_artifact_manifest.cmake

      - name: Verify release signing-handoff hosted artifact manifest
        run: >
          cmake
          -DANO_CRYPTO_SOURCE_DIR=${{ github.workspace }}
          -DANO_CRYPTO_HOSTED_ARTIFACT_ROOT=hosted-release-signing-handoff-bundle
          -DANO_CRYPTO_EXPECTED_HOSTED_LANE=${{ env.HOSTED_SIGNING_LANE }}
          -DANO_CRYPTO_EXPECTED_HOSTED_PLATFORM=Linux
          -DANO_CRYPTO_EXPECTED_HOSTED_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_EXPECTED_HOSTED_WORKFLOW_REF=${{ github.ref }}
          -P tools/check_hosted_artifact_manifest.cmake

      - name: Upload release signing-handoff hosted bundle
        uses: actions/upload-artifact@v4
        with:
          name: anocrypto-c-p2-05-signing-handoff-Linux-${{ matrix.cc }}
          path: hosted-release-signing-handoff-bundle
          if-no-files-found: error

      - name: Upload evidence draft
        uses: actions/upload-artifact@v4
        with:
          name: anocrypto-c-p2-05-evidence-draft-${{ matrix.cc }}
          path: build/evidence/p2-07
          if-no-files-found: error

  hosted-artifact-index:
    name: Verify and index hosted artifact bundles
    runs-on: ubuntu-latest
    needs: [build-test-smoke, differential-validation, core-portability-32bit, aes-cmac-compiler-output-review, aes-big-endian-s390x, clean-release-symbol-baseline, tagged-release-compatibility, evidence-draft]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: anocrypto-c-p2-05-hosted-platform-*
          path: downloaded-hosted-artifacts
          merge-multiple: false

      - name: Download differential bundles
        uses: actions/download-artifact@v4
        with:
          pattern: anocrypto-c-p2-05-openssl-differential-*
          path: downloaded-hosted-artifacts
          merge-multiple: false

      - name: Download portability bundles
        uses: actions/download-artifact@v4
        with:
          pattern: anocrypto-c-p2-05-portability-*
          path: downloaded-hosted-artifacts
          merge-multiple: false

      - name: Download compiler-output bundles
        uses: actions/download-artifact@v4
        with:
          pattern: anocrypto-c-p2-05-compiler-output-*
          path: downloaded-hosted-artifacts
          merge-multiple: false

      - name: Download symbol compatibility bundles
        uses: actions/download-artifact@v4
        with:
          pattern: anocrypto-c-p2-05-symbol-compatibility-*
          path: downloaded-hosted-artifacts
          merge-multiple: false

      - name: Download tagged compatibility bundles
        uses: actions/download-artifact@v4
        with:
          pattern: anocrypto-c-p2-05-tagged-compatibility-*
          path: downloaded-hosted-artifacts
          merge-multiple: false

      - name: Download signing-handoff bundles
        uses: actions/download-artifact@v4
        with:
          pattern: anocrypto-c-p2-05-signing-handoff-*
          path: downloaded-hosted-artifacts
          merge-multiple: false

      - name: Download release-provenance bundles
        uses: actions/download-artifact@v4
        with:
          pattern: anocrypto-c-p2-05-release-provenance-*
          path: downloaded-hosted-artifacts
          merge-multiple: false

      - name: Verify manifests and create hosted artifact index
        run: >
          cmake
          -DANO_CRYPTO_SOURCE_DIR=${{ github.workspace }}
          -DANO_CRYPTO_HOSTED_ARTIFACT_ROOT=${{ github.workspace }}/downloaded-hosted-artifacts
          -DANO_CRYPTO_HOSTED_ARTIFACT_OUTPUT_DIR=${{ github.workspace }}/hosted-artifact-index
          -DANO_CRYPTO_WORKFLOW_RUN_ID=${{ github.run_id }}
          -DANO_CRYPTO_WORKFLOW_COMMIT=${{ github.sha }}
          -DANO_CRYPTO_WORKFLOW_REF=${{ github.ref }}
          -P tools/create_hosted_artifact_index.cmake

      - name: Upload hosted artifact index
        uses: actions/upload-artifact@v4
        with:
          name: anocrypto-c-p2-05-hosted-artifact-index
          path: hosted-artifact-index
          if-no-files-found: error
