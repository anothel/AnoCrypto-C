        run: cmake --build build-s390x --target ano_crypto_aes_hardening_policy_check

      - name: AES-CMAC hardening policy check
        run: cmake --build build-s390x --target ano_crypto_cmac_hardening_policy_check

      - name: Create s390x hosted artifact manifest
        run: >
